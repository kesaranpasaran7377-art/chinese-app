<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国語AI学習アプリ</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 10px; background-color: #f8f9fa; color: var(--dark); padding-bottom: 80px; }
        h1 { text-align: center; font-size: 1.5em; margin-bottom: 10px; }
        
        /* メイン学習エリア */
        .study-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 15px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .word { font-size: 3em; font-weight: bold; margin: 0; line-height: 1.2; cursor: pointer; }
        .pinyin { font-size: 1.3em; color: #666; margin: 5px 0 10px 0; min-height: 1.5em;}
        .meaning { font-size: 1.2em; color: var(--dark); background: #eee; padding: 5px 15px; border-radius: 20px; }
        .meaning.hidden { opacity: 0; }
        
        /* コントロールボタン */
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { border: none; padding: 12px; border-radius: 10px; color: white; font-size: 1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box;}
        .btn-audio { background-color: var(--primary); }
        .btn-next { background-color: var(--dark); grid-column: span 2; }
        .btn-listen-mode { background-color: #6f42c1; grid-column: span 2;}
        .btn-speak-mode { background-color: var(--warning); color: var(--dark); grid-column: span 2;}
        .btn-speaking { animation: pulseSpeak 1.5s infinite; background-color: var(--danger) !important; color: white !important;}
        
        #speakStatus { font-weight: bold; margin-top: 10px; min-height: 1.5em; font-size: 1em;}
        .status-good { color: var(--success); }
        .status-try { color: var(--danger); }

        /* 単語追加フォーム（常に表示） */
        .admin-panel { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px;}
        .admin-panel h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.1em; color: #333; }
        input { padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; font-size: 1em; }
        .btn-add { background-color: var(--success); width: 100%; font-size: 1.1em; padding: 12px; }
        
        /* 一覧表示 */
        .word-list { margin-top: 15px; max-height: 150px; overflow-y: auto; border-top: 1px solid #eee; }
        .list-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em;}
        .btn-delete { background-color: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        @keyframes pulseSpeak { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>

    <h1>中国語AI学習アプリ</h1>

    <!-- 学習セクション -->
    <div class="study-container">
        <div class="word" id="cardWord" onclick="playAudio('zh')">単語を追加</div>
        <div class="pinyin" id="cardPinyin">-</div>
        <div class="meaning" id="cardMeaning">-</div>
        <div id="speakStatus"></div>
    </div>

    <!-- コントロールパネル -->
    <div class="control-panel">
        <button class="btn btn-audio" onclick="playAudio('zh')">🔊 発音を聞く</button>
        <button class="btn btn-audio" style="background-color:#888;" onclick="playAudio('ja')">🔊 意味を聞く</button>
        <button class="btn btn-listen-mode" id="btnAutoPlay" onclick="toggleAutoPlay()">🎧 リスニング (自動再生) 開始</button>
        <button class="btn btn-speak-mode" id="btnSpeakCheck" onclick="startSpeakCheck()">🎤 発音練習 (AI判定) 開始</button>
        <button class="btn btn-next" onclick="nextCard()">次の単語へ ➔</button>
    </div>

    <!-- 単語登録・管理エリア（常時表示） -->
    <div class="admin-panel">
        <h3>➕ 新しい単語を追加</h3>
        <input type="text" id="inputWord" placeholder="中国語 (例: 你好)">
        <input type="text" id="inputPinyin" placeholder="ピンイン (例: nǐ hǎo)">
        <input type="text" id="inputMeaning" placeholder="日本語の意味 (例: こんにちは)">
        <button class="btn btn-add" onclick="addWord()">保存する</button>
        
        <h4 style="margin-top:15px; margin-bottom:5px;">登録済み一覧</h4>
        <div class="word-list" id="wordList"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyCiqmPyDLyQqgj4Xco-68JUeScrlNluUyA",
            authDomain: "chinese-app-11197.firebaseapp.com",
            projectId: "chinese-app-11197",
            storageBucket: "chinese-app-11197.firebasestorage.app",
            messagingSenderId: "522745395693",
            appId: "1:522745395693:web:aafbb071a78aeadf8b8fe4",
            measurementId: "G-SHFRT080X1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let words = [];
        let currentIndex = 0;
        let isAutoPlaying = false;
        
        // 音声認識
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
        }

        // 音声再生
        function playAudio(lang, textToSpeak = null) {
            if (words.length === 0 && !textToSpeak) return;
            window.speechSynthesis.cancel();

            const current = words[currentIndex % words.length];
            const text = textToSpeak || (lang === 'zh' ? current.word : current.meaning);
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'zh' ? 'zh-CN' : 'ja-JP';
            utterance.rate = 0.9;

            return new Promise(resolve => {
                utterance.onend = resolve;
                window.speechSynthesis.speak(utterance);
            });
        }

        // 自動再生
        async function toggleAutoPlay() {
            const btn = document.getElementById("btnAutoPlay");
            if (words.length === 0) return;

            if (isAutoPlaying) {
                isAutoPlaying = false;
                btn.innerText = "🎧 リスニング (自動再生) 開始";
                btn.style.backgroundColor = "#6f42c1";
                window.speechSynthesis.cancel();
            } else {
                isAutoPlaying = true;
                btn.innerText = "⏹️ 自動再生を停止";
                btn.style.backgroundColor = "#dc3545";
                hideMeaning(true);
                runAutoPlayLoop();
            }
        }

        async function runAutoPlayLoop() {
            while (isAutoPlaying && words.length > 0) {
                await playAudio('zh');
                await new Promise(r => setTimeout(r, 1000));
                if (!isAutoPlaying) break;

                hideMeaning(false);
                await playAudio('ja');
                await new Promise(r => setTimeout(r, 2000));
                if (!isAutoPlaying) break;

                hideMeaning(true);
                nextCard();
            }
        }

        // 発音判定
        function startSpeakCheck() {
            if (!SpeechRecognition) { alert("お使いのブラウザは音声認識に対応していません。ChromeやSafariでお試しください。"); return; }
            if (words.length === 0 || isAutoPlaying) return;

            const current = words[currentIndex % words.length];
            const targetWord = current.word;
            const btn = document.getElementById("btnSpeakCheck");
            const status = document.getElementById("speakStatus");

            btn.classList.add("btn-speaking");
            btn.innerText = "🎙️ 録音中... 発音してください";
            status.innerText = "お聞きしています...";
            status.className = "";

            recognition.start();

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                status.innerText = `あなたの発音: "${spokenText}"`;

                if (spokenText === targetWord) {
                    status.innerHTML += "<br><span class='status-good'>🎉 合格！完璧です！</span>";
                    playAudio('zh', "真棒");
                } else {
                    status.innerHTML += `<br><span class='status-try'>😢 惜しい！正解は「${targetWord}」です</span>`;
                }
            };

            recognition.onerror = () => {
                status.innerText = "音声が認識できませんでした。";
                status.className = "status-try";
            };

            recognition.onend = () => {
                btn.classList.remove("btn-speaking");
                btn.innerText = "🎤 発音練習 (AI判定) 開始";
            };
        }

        function nextCard() {
            if (words.length === 0) return;
            document.getElementById("speakStatus").innerText = "";
            if(!isAutoPlaying) hideMeaning(false);
            currentIndex++;
            showCard(currentIndex % words.length);
        }

        function showCard(index) {
            const current = words[index];
            document.getElementById("cardWord").innerText = current.word;
            document.getElementById("cardPinyin").innerText = current.pinyin;
            document.getElementById("cardMeaning").innerText = current.meaning;
        }

        function hideMeaning(shouldHide) {
            const meaning = document.getElementById("cardMeaning");
            if (shouldHide) meaning.classList.add("hidden");
            else meaning.classList.remove("hidden");
        }

        // リアルタイム同期
        db.collection("words").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            words = [];
            document.getElementById("wordList").innerHTML = "";
            snapshot.forEach((doc) => {
                const item = doc.data(); item.id = doc.id; words.push(item);
                const div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `<div><strong>${item.word}</strong> (${item.pinyin}) : ${item.meaning}</div><button class="btn-delete" onclick="deleteWord('${item.id}')">削除</button>`;
                document.getElementById("wordList").appendChild(div);
            });
            if (words.length > 0) showCard(currentIndex % words.length);
        });

        // 単語保存
        function addWord() {
            const word = document.getElementById("inputWord").value;
            const pinyin = document.getElementById("inputPinyin").value;
            const meaning = document.getElementById("inputMeaning").value;
            if (!word || !meaning) { alert("中国語と意味を入力してください。"); return; }
            
            db.collection("words").add({ 
                word: word, 
                pinyin: pinyin, 
                meaning: meaning, 
                createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            }).then(() => { 
                document.getElementById("inputWord").value = ""; 
                document.getElementById("inputPinyin").value = ""; 
                document.getElementById("inputMeaning").value = ""; 
            });
        }

        function deleteWord(id) { if(confirm("削除しますか？")) db.collection("words").doc(id).delete(); }
    </script>
</body>
</html>
